name: Daily FVG Scanner

on:
  schedule:
    # This triggers at 7:30 PM NYC Time (EDT)
    - cron: '30 23 * * 1-5'
  workflow_dispatch: # Allows manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pandas requests yfinance numpy

      - name: Run Scanner Script
        run: |
          # Run your FVG script and print everything into a standard report file
          python fvg_scanner.py > daily_fvg_report.txt

      - name: Send Daily FVG Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Daily FVG Market Scan Results"
          to: stocks.scanner0@gmail.com
          from: GitHub FVG Scanner
          body: file://daily_fvg_report.txt
